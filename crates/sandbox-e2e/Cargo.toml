[package]
name = "sandbox-e2e"
version = "0.1.0"
edition = "2024"
description = "End-to-end tests for the sandbox container manager"

[dependencies]
sandbox-client = { path = "../sandbox-client" }
sandbox-proto = { path = "../sandbox-proto" }
clap = { version = "4", features = ["derive", "env"] }
nix = { version = "0.31.2", features = ["uio"] }
serde_json = "1"
